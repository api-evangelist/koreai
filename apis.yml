aid: koreai
name: Kore.ai
description: >-
  Kore.ai is an enterprise conversational and agentic AI platform used to build, deploy,
  govern and observe AI agents for customer experience and employee experience work —
  contact center automation, voice AI, IT and HR service desks, agent assist, quality
  assurance and no-code agent orchestration. The company ships two API estates. The newer
  Agent Platform ("Artemis") on agents.kore.ai exposes an ABL Runtime API for chat,
  streaming, workflow invocation and session usage, an Agent Blueprint Language (ABL) DSL,
  and a 45-tool stdio MCP server (@koreai/arch-mcp-tools) that turns the platform's own
  control plane into agent tooling. The longer-established AI for Service estate on
  platform.kore.ai exposes a large REST surface across Automation AI, Search AI, Contact
  Center AI, Agent AI, Quality AI and Case Management, authenticated with JWT apps and
  governed by an assigned API-scope model. Kore.ai is headquartered in Orlando, Florida and
  is recognized as a Leader in the Gartner Magic Quadrant for Conversational AI, the
  Forrester Wave for Conversational AI Platforms and the Everest Group PEAK Matrix for
  Agentic AI Products.
