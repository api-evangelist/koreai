apis:
- name: Kore.ai AI for Service Platform APIs
  description: >-
    The AI for Service REST estate — Automation AI (bot lifecycle, NLP training, analytics, admin, data
    tables), Search AI (answer generation, content and chunk management, ingestion, connectors), Contact
    Center AI (agents, queues, skills, campaigns, voice gateway, WFM), Agent AI (conversation data, transcription
    control, post-conversation hooks), Quality AI (raw data, Auto QA scoring) and Case Management. Authenticated
    with a JWT minted from a JWT App and governed by assigned Platform and Admin Console API scopes. Documented
    as prose reference pages; no machine-readable contract is published for this estate.
  humanURL: https://docs.kore.ai/ai-for-service/apis/api-list
  baseURL: https://platform.kore.ai
