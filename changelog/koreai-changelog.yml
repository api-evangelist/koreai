structure_note: >-
  Kore.ai publishes TWO changelogs, one per estate. The Agent Platform ("Artemis") notes
  are a single dated, versioned stream. The AI for Service notes are split across eight
  per-module streams (Automation AI, Search AI, Contact Center AI, Agent AI, Quality AI,
  Voice Gateway, Platform Services, Deprecations) with 2024 and 2025 archives, and they are
  dated but NOT version-numbered. Neither changelog marks entries as breaking vs additive
  in a machine-readable way; breaking changes surface on the separate Deprecations page.
entries:
- version: v1.4.4
  date: '2026-08-17'
  type: patch
  breaking: false
  highlights:
  - Author trusted SIP transfer destinations directly on the built-in call_transfer tool, validated by the compiler at publish time.
  - Project-level minimum speech-to-text confidence threshold; transcripts below it are treated as no input.
  - 'HTTP tools support {{#each input.X}} body templates for dynamic batch payloads.'
  - Azure BYOK for same-tenant Key Vault no longer requires a customer Entra app registration; a platform-owned Workload Identity Federation app is used instead.
  - BYOK/KMS workspaces can select a compliance level (GDPR, SOC2 or NIST) enforced at KMS configuration write; key rotation split into independently controlled DEK retirement and KEK rewrap.
- version: v1.4.3
  date: '2026-08-13'
  type: patch
  breaking: false
  highlights:
  - Stability and resilience updates to agent handoffs, long-duration calls and authentication flows; conversation routing and recording playback improvements.
- version: v1.4.2
  date: '2026-08-08'
  type: patch
  breaking: false
  highlights:
  - 'Secure secret handling: tools can return API keys, tokens and credentials into an encrypted session-scoped vault that stays invisible to the model and the transcript, restored downstream with {{_secret.X}}.'
  - Configurable PSTN transfer target number for agent-initiated call transfers, alongside SIP.
- version: v1.4.1
  date: '2026-08-01'
  type: patch
  breaking: false
- version: v1.4.0
  date: '2026-07-30'
  type: major
  breaking: false
  highlights:
  - Connect a Git repository to a project to sync agent definitions and localization assets, with push/pull from the Studio editor and conflict resolution.
  - Start-input defaults and required-input validation are applied server-side across every workflow trigger path (cron, webhook, connector-polling, agent-triggered), not just Studio's Run dialog.
