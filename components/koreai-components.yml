security_notes:
- Public widget keys (pk_) are safe to expose in client-side code only when origin-restricted; the docs say so explicitly.
- CORS headers on widget/SDK endpoints are derived from the configured allowedOrigins list.
- SDK security guidance is published at https://docs.kore.ai/ai-for-service/sdk/sdk-security
