generated: '2026-08-23'
method: searched
source: https://docs.kore.ai/agent-platform/sdks + https://github.com/Koredotcom
note: >-
  Kore.ai ships embeddable client-side surfaces distinct from its server SDKs — chat and
  voice widgets a customer drops into their own web app or native app, plus an agent-desktop
  widget for contact center consoles. These are bootstrapped with an origin-restricted
  public key (pk_) exchanged on POST /api/v1/sdk/init for a short-lived SDK session token,
  and the runtime validates the Origin header on every SDK request against a configured
  allowedOrigins list.
families:
- family: Agent Platform (Artemis) Web SDK
  description: Embeddable web component for voice and chat interactions with Agent Platform agents.
  surface: web
  loader:
    package: '@koreai/artemis-web-sdk'
    registry: npm
    version: 1.1.0
    published: '2026-08-03'
  docs: https://docs.kore.ai/agent-platform/sdks
  channel_setup: https://docs.kore.ai/agent-platform/channels/set-up-web-sdk-channel
  bootstrap:
    endpoint: POST /api/v1/sdk/init
    key_header: X-Public-Key
    key_prefix: pk_
    config_endpoint: 'GET /api/v1/sdk/config/{projectId}'
    origin_restriction: allowedOrigins list validated on every request
