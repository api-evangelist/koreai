domain_standards:
  note: >-
    REWARD-ONLY check. The enterprise conversational/agentic AI market has no single
    settled interchange standard, and Kore.ai's contract declares none of the candidates
    (no SCIM URN, no OData $metadata, no ActivityPub actor, no HL7/X12/ISO-20022 message
    type). The nearest thing to a domain standard it does declare is MCP, recorded above.
    Kore.ai has also authored its own domain language, ABL (Agent Blueprint Language),
    which is a first-party DSL rather than a shared standard.
