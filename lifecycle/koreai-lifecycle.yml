versioning:
  scheme: uri-path
  current: v1
  docs: https://github.com/Koredotcom/docs-v2/blob/main/agent-platform/drafts/api-reference/index.mdx
  policy: >-
    Agent Platform endpoints are versioned with an /api/v1/ prefix for core APIs, or scoped
    under /api/projects/{projectId}/ for project-level resources. The provider states that
    when breaking changes are introduced a new version prefix (for example /api/v2/) is
    added and previous versions remain available during a documented deprecation window.
    The length of that window is not stated.
  product_versioning:
    scheme: semver
    current: v1.4.4
    as_of: '2026-08-17'
    note: The Agent Platform (Artemis) ships dated semver releases; see changelog/koreai-changelog.yml.
  app_versioning_docs: https://docs.kore.ai/ai-for-service/deployment/app-versioning
deprecation:
  policy_url: https://docs.kore.ai/ai-for-service/release-notes/deprecations
  sunset_header: false
  deprecation_header: false
  header_note: >-
    No RFC 8594 Sunset header and no Deprecation header is documented on any Kore.ai
    surface. Deprecation is communicated as a dated notice page and in release notes, not
    in the response.
  style: dated-notice-page
  notices:
  - item: ML network types MLP-BOW, MLP-WordEmbeddings, LSTM, CNN, Transformer, KAEN
    removal_date: '2026-08-29'
    action_required: >-
      Migrate to a supported network (Standard, Multi-lingual, Zero-shot Model, Few-shot
      Model) and retrain before the date, or the app stops functioning. After the date the
      platform auto-migrates deprecated networks to the Few-shot Model paired with BGE-M3
      and the app must be retrained to restore functionality.
  - item: Embedding models Qwen2-7B-Instruct, LaBSE, MPNet
    removal_date: '2026-08-29'
    action_required: Migrate to Pre-trained MPNet or BGE-M3 before the date.
  - item: Azure OpenAI gpt-4o v2024-05-13 / v2024-08-06 and gpt-4o-mini on Azure Standard deployments
    removal_date: '2026-03-31'
    upstream: true
    action_required: >-
      Upstream Microsoft retirement affecting Kore.ai customers using Custom Integration or
      custom prompts. Auto-upgraded deployments now run gpt-5.1 / gpt-5-mini and custom
      prompts must replace max_tokens with max_completion_tokens.
  - item: Azure OpenAI Global Standard / Provisioned / Data Zone Standard deployments
    removal_date: '2026-10-01'
    upstream: true
    action_required: Revisit before 1 October 2026.
