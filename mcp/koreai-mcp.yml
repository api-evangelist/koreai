tool_source: >-
  Tool names were read from the published package's own registry
  (dist/src/tools/index.js in @koreai/arch-mcp-tools@1.5.0, downloaded from
  registry.npmjs.org on 2026-08-23), not inferred from prose. Descriptions come from the
  provider's own tool tables at docs.kore.ai/agent-platform/use-mcp-server.
deployment:
  mode: local-stdio
  endpoint: null
  install: npx -y @koreai/arch-mcp-tools
  package: https://www.npmjs.com/package/@koreai/arch-mcp-tools
  auth: oauth
  verified: probed
  note: >-
    There is NO remote/hosted MCP endpoint. Kore.ai ships a stdio server a human must
    install locally; an agent cannot reach Kore.ai over MCP without that install. Auth is
    handled inside the server by platform_connect, which tries an explicit authToken, the
    encrypted credential store shared with `kore-platform-cli login`, then a browser
    device-authorization flow. The environment is selected with the AGENTS_URL variable
    (default region https://agents.kore.ai).
server:
  name: arch-agent-platform
  transport: stdio
  command: npx
  args:
  - -y
  - '@koreai/arch-mcp-tools'
  version: 1.5.0
  version_published: '2026-08-20'
  license: MIT
  repository: https://github.com/Koredotcom/agents-mcp-tools
  pinned_install_example: '@koreai/arch-mcp-tools@1.5.0'
  env:
  - name: AGENTS_URL
    required: false
    description: Region-specific Agent Platform URL to pin (for example https://agents.kore.ai).
  resources:
  - uri: arch://guidance/v1/manifest
    description: Operation/dependency catalog the packaged Agent Skill requires (schemaVersion "1") before catalog-driven planning.
  prompts:
  - name: plan-platform-operation
    description: Plan a new multi-feature Agent Platform task.
  - name: verify-platform-operation
    description: Verify a specific action after it was executed.
  clients_documented:
  - Claude Code
  - Codex CLI
  - Cursor
  - VS Code (GitHub Copilot)
safety_model:
  note: >-
    The provider documents an explicit write-safety taxonomy for its tools —
    read, write, idempotent_write, grant_gated_write, destructive_write — and states that
    grant-gated and destructive operations require an attempt-bound grant returned by
    Studio. Credential-bearing auth profiles cannot be created over MCP:
    platform_auth_profiles(create) only accepts authType "none" and otherwise returns a
    secureSetupRequired handoff, because secrets must never enter MCP or model context.
