method: derived
source: mcp/koreai-mcp.yml + openapi/koreai-abl-runtime-*-openapi.json
note: >-
  The Arch MCP server and the published ABL Runtime OpenAPI describe DIFFERENT halves of
  the same platform, and the divergence is the finding. MCP is a CONTROL-PLANE surface
  (projects, agents, workflows, deployments, evals, traces) whose backing management REST
  routes are documented only in prose at
  github.com/Koredotcom/docs-v2/blob/main/agent-platform/drafts/api-reference/management-apis.mdx
  and are absent from the three machine-readable specs. The OpenAPI files are a
  DATA-PLANE surface (chat, streaming, workflow invocation, usage). Almost nothing binds
  cleanly, so almost every row is honestly mcp_only or rest_only rather than a forced
  mapping.
surfaces:
  openapi:
  - openapi/koreai-abl-runtime-conversation-openapi.json
  - openapi/koreai-abl-runtime-workflows-openapi.json
  - openapi/koreai-abl-runtime-sessions-openapi.json
  graphql: null
  mcp:
    server: arch-agent-platform
    transport: stdio
    install: npx -y @koreai/arch-mcp-tools
    tools_list_gated: true
    tools_list_note: Requires local install plus an authenticated platform_connect; names taken from the package tool registry.
crosswalk:
- tool: platform_workflows
  category: workflows
  rest:
  - runtime.workflow.invoke
  - runtime.workflow.execute
  - runtime.workflow.executeVersion
  - runtime.workflow.getExecution
  binding: rest
  confidence: medium
  note: >-
    The tool's documented "execute" action maps to the four published workflow-execution
    operations. Its create/update/publish/expose-as-tool actions have no published REST
    operation.
- tool: debug_send_message
  category: conversation
  rest:
  - runtime.agent.chat
  - runtime.agent.stream
  binding: rest
  confidence: medium
  note: >-
    Mapped by semantics — "send a message to an agent" is exactly what the deployment-scoped
    chat and SSE stream operations do. The debug tool operates on a debug session created by
    debug_load_agent rather than on a deployed agent, so the binding is not exact.
- tool: debug_session_history
  category: sessions
  rest:
  - runtime.legacyChat.getUsage
  binding: rest
  confidence: low
  note: >-
    Weak. Both read durable session data, but getUsage returns usage metrics for a project,
    not the trace pages debug_session_history returns. The session-listing REST routes
    (/api/projects/:projectId/sessions) are prose-documented only and absent from the specs.
